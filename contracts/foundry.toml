[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = false

[rpc_endpoints]
# Mainnet 4663 — do not use for Carry grant/testnet demos.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
# Robinhood Chain Testnet 46630 — preferred Carry deploy target (mocks + vault).
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
