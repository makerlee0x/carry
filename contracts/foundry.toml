[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
solc = "0.8.28"
optimizer = true
# Size-first: runs = 1. via_ir is required (the legacy pipeline hits stack-too-deep on the vault).
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false

[rpc_endpoints]
# Mainnet 4663 — do not use for Carry grant/testnet demos.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
# Robinhood Chain Testnet 46630 — preferred Carry deploy target (mocks + vault).
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[invariant]
# Integration suite (test/integration/Invariants.t.sol). Kept short for the git hook; CI runs the ci profile.
runs = 64
depth = 50
fail_on_revert = false

[profile.ci.invariant]
runs = 512
depth = 100

# Uniswap DualPoolHook, vendored verbatim under hook/ (see hook/PROVENANCE.md). Build with
# `FOUNDRY_PROFILE=hook forge build --offline --use ~/.svm/0.8.26/solc-0.8.26`. It is kept out
# of the default profile so the vault's size-first 0.8.28 build is untouched. Settings follow
# upstream's `alf` profile (via_ir, runs 200, cancun).
[profile.hook]
src = "hook/src"
test = "hook/test"
out = "out-hook"
cache_path = "cache-hook"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@uniswap/blocknumberish/=lib/blocknumberish/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "v4-core/=lib/v4-core/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
