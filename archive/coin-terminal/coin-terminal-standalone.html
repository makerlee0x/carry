<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Terminal — Carry palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-coin-terminal-fonts href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<script>if(/[?&]embed\b/.test(location.search))document.documentElement.classList.add("embed");</script>
<style>
  .embed .hint { display: none; }
  :root {
    --carry-bg: #0b0c0a; --carry-putty: #a09173;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --carry-bg: #0b0c0a; } }
  :root[data-theme="dark"] { --carry-bg: #0b0c0a; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--carry-bg); color: var(--carry-putty);
         font-family: "Inter Tight", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas:focus-visible { outline: 2px solid #b7ffae; outline-offset: -4px; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
          margin: 0; font-size: 14px; opacity: .8; pointer-events: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Assembling the terminal…</div>
<p class="hint">Drag to inspect. Double-click to reset the view.</p>
