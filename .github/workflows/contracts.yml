name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge tests (unit + integration + invariants, deep fuzz)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test
      - name: DualPoolHook build and strategy-on-hook tests (solc 0.8.26)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: hook
        run: forge test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
